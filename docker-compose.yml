# FinScope Enterprise Docker Compose
# 企业级部署配置

version: '3.8'

services:
  # FinScope 主服务
  finscope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finscope-enterprise
    ports:
      - "${SERVICE_PORT:-8501}:8501"
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/uploaded:/app/data/uploaded
      - ./data/audit_logs:/app/data/audit_logs
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
    restart: unless-stopped
    networks:
      - finscope-network
    depends_on:
      redis:
        condition: service_healthy

  # Redis 缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: finscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finscope-network

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: finscope-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - finscope
    restart: unless-stopped
    networks:
      - finscope-network

volumes:
  redis-data:

networks:
  finscope-network:
    driver: bridge
